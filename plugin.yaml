name: signal-tools
version: 0.3.2
description: "Signal tools for coding agents: chats, messages, contacts, received files and sends."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - signal_account_read
  - signal_chat_read
  - signal_contact_read
  - signal_file_save
  - signal_file_send
  - signal_message_delete
  - signal_message_edit
  - signal_message_react
  - signal_message_send
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
  emoji:
    type: dict
    description: 'The emoji shown beside each toolset, by toolset name; "" shows none. Merged over the package''s emoji.'
  download_dir:
    description: Where received files are saved; an absolute path, or one starting with ~. Defaults to ~/Downloads/signal-tools.
  send_dirs:
    type: list
    description: The directories files may be sent from, besides the working directory; absolute paths, or ones starting with ~, without commas. Defaults to none.
